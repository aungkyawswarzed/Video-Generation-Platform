<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <title>Frame Studio</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #151b15;
        color: #d3ed9e;
        font:
          15px 'Segoe UI',
          sans-serif;
      }
      main {
        text-align: center;
        max-width: 480px;
        padding: 30px;
      }
      img {
        height: 90px;
        width: 90px;
      }
      h1 {
        font-size: 38px;
        font-weight: 650;
        letter-spacing: -2px;
        margin: 20px 0 12px;
      }
      p {
        color: #9cac90;
        line-height: 1.8;
        font-size: 13px;
      }
      .loader {
        height: 3px;
        width: 160px;
        background: #33442b;
        margin: 28px auto;
        border-radius: 10px;
        overflow: hidden;
      }
      .loader:after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        background: #d3ed9e;
        animation: load 1.3s ease-in-out infinite alternate;
      }
      @keyframes load {
        to {
          transform: translateX(125%);
        }
      }
      small {
        font-size: 11px;
        color: #6d8060;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/frame.svg" alt="Frame Studio" />
      <h1>Frame Studio</h1>
      <p>Opening your production workspace…</p>
      <div class="loader"></div>
      <small>Everything starts automatically. No terminal needed.</small>
    </main>
  </body>
</html>
